# Builds an unsigned IPA on a GitHub macOS runner, for sideloading without a Mac
# (Sideloadly / AltStore on Windows re-sign it with your own Apple ID).
# The default build has no entitlements, so a free Apple ID can sign it.
name: Build IPA

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Bundle ID (must be unique; the widget gets <id>.activity)
        default: com.zhangkeliang2916.esp32agent

jobs:
  ipa:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      BUNDLE_ID: ${{ inputs.bundle_id }}
    steps:
      - uses: actions/checkout@v5
      - name: Build (Release, device, unsigned)
        run: |
          xcodebuild -version
          xcodebuild build -project IPhoneAgent.xcodeproj -scheme IPhoneAgent \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build IA_BUNDLE_ID="$BUNDLE_ID" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IPhoneAgent.app Payload/
          zip -qry ESP32Agent-unsigned.ipa Payload
          ls -lh ESP32Agent-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: ESP32Agent-unsigned-ipa
          path: ios/ESP32Agent-unsigned.ipa
          if-no-files-found: error
